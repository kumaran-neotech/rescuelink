dependencies:
  flutter:
    sdk: flutter
  
  # Voice Pipeline
  vosk_flutter: ^0.3.18        # Offline speech-to-text
  permission_handler: ^11.3.0  # Microphone permission
  path_provider: ^2.1.3        # File paths for Vosk model
  
  # Dashboard + Maps
  flutter_map: ^7.0.2          # OpenStreetMap display
  latlong2: ^0.9.1            # Latitude/longitude handling
  geolocator: ^13.0.1         # GPS location (optional, for victim location)
  
  # Storage (shared with Person B but you'll use it too)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  uuid: ^4.5.1                # Generate unique ticket IDs
  intl: ^0.19.0               # Date formatting

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13